# League #1 (High Stakes Fantasy): the default Hermes profile, i.e. this directory. See docs/MULTILIGA.md.
#
# legacy_layout: league data stays where it always was (league/knowledge_base, state files next to the code);
# any other league lives in data/profiles/<slug>/ with its data under <home>/league/.
# The WhatsApp group, admin numbers and people phones are NOT here: group_jid falls back to WHATSAPP_GROUP_JID and the
# admin/phones to the container environment (data/.env), so no personal number is versioned.
#
# people: the names/nicknames the group actually uses (managers missing here are read from Sleeper).
# rules.seeding=division_winners: seeds 1..N are the N division leaders, the rest by record then PF (Sleeper ranks by record only).
# rules.season_start: NFL kickoff per season (default = Thursday after Labor Day). Trades/waivers before it are "offseason" (week 0), not week 1.
# rules.draft_order: house rule "rookie draft order = Max PF ascending (anti-tanking)" — Sleeper does not model it.
slug: hsf
sleeper_league_id: '1312694161610113024'
legacy_layout: true
name: High Stakes Fantasy
